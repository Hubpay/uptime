# Hubpay public status page — Upptime configuration
# Repo: https://github.com/Hubpay/uptime  (must be PUBLIC for the site to read its own data via the GitHub API)
# Page: https://status.hubpay.io  (Cloudflare hubpay.io zone: CNAME status -> hubpay.github.io, DNS/CDN
#       managed in internal infra config; GitHub Pages source: gh-pages branch).
# Checks run every 5 min from GitHub-hosted runners.
# NOTE: after editing this file dispatch "Static Site CI" (and "Summary CI") manually unless a GH_PAT secret
#       with `workflow` scope exists — the default Actions token cannot rewrite workflow files, so Setup CI fails.

owner: Hubpay
repo: uptime
user-agent: hubpay-status

# The two production liveness routes sit behind a Cloudflare Access application that only admits this
# service token. Values are provisioned internally and stored as repository secrets:
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
secrets:
  - CF_ACCESS_CLIENT_ID
  - CF_ACCESS_CLIENT_SECRET

sites:
  - name: Website
    url: https://hubpay.io
    slug: hubpay-website          # slugs pinned to the original history files so graphs/uptime keep their full history across renames
  - name: Hubpay Business
    url: https://business.hubpay.io   # business.hubpay.io portal
    slug: business-portal
  - name: Hubpay app
    slug: wallet-api-spring-boot-health
    url: https://wallet.hubpay.ae/actuator/health/liveness   # Spring Boot actuator liveness for the wallet service behind the Hubpay app; expects HTTP 200 {"status":"UP"}
    expectedStatusCodes: [200]
    headers:
      - "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
      - "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
  - name: API
    slug: public-api-spring-boot-health
    url: https://api.hubpay.ae/actuator/health/liveness   # Spring Boot actuator liveness
    expectedStatusCodes: [200]
    headers:
      - "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
      - "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
# Scope: website, business portal, public API and mobile app API only.
# uaepass.hubpay.io is IP-allow-listed to UAE PASS egress + VPC by AWS WAF (403 to everyone else) so it cannot be
# monitored from GitHub runners; pay.hubpay.ae and corporate.hubpay.ae were dropped from the public page.
# NOTE: the bare hubpay.ae root domain has never served the site (known unresolved domain issue) — hubpay.io is the canonical web address, so hubpay.ae is intentionally not monitored.

# Schedules. Uptime CI only commits on status changes; response times (which feed the graphs) are recorded by
# Response Time CI, so sample every 30 min instead of Upptime's once-a-day default and redraw graphs/summary every 6 h.
# NOTE: without a GH_PAT secret Setup CI cannot regenerate the workflow files, so the crons in
# .github/workflows/{response-time,graphs,summary}.yml are kept in sync by hand.
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "*/30 * * * *"
  graphs: "15 */6 * * *"
  summary: "20 */6 * * *"
  staticSite: "0 1 * * *"

# Colours for the response-time chart on each service's history page (read by the status-page Graph component)
graphBackgroundColor: "#EDEAFD"
graphBorderColor: "#241C3F"

i18n:
  footer: "© Hubpay. Availability is checked every 5 minutes; incidents are listed above as they happen."
  liveStatus: "Services"
  activeIncidents: "Active incidents"
  pastIncidents: "Past incidents"
  overallUptime: "Uptime $UPTIME"
  averageResponseTime: "Response $TIMEms"
  incidentReport: "Incident #$NUMBER →"

status-website:
  cname: status.hubpay.io            # Cloudflare (hubpay.io zone): CNAME status -> hubpay.github.io
  publish: true                      # build the site even while the repo is private (data still needs a public repo)
  name: Hubpay Status
  hideNavTitle: true                 # the wordmark already says Hubpay
  logoUrl: https://status.hubpay.io/logo.svg     # assets/ is copied to the site root at build time (root-relative paths make the exporter crawl them as routes); hubpay.io wordmark (framerusercontent WYBD3duRxnumGKVgo1mhVFkIs.svg, 114×32)
  favicon: https://status.hubpay.io/favicon.svg
  introTitle: "Hubpay system status"
  introMessage: "Live availability of Hubpay's customer-facing services, checked every five minutes. For support, visit [hubpay.io/contact-us](https://hubpay.io/contact-us)."
  navbar:
    - title: Status
      href: /
    - title: hubpay.io
      href: https://hubpay.io
    - title: Support
      href: https://hubpay.io/contact-us
  metaTags:
    - name: description
      content: "Live status and incident history for Hubpay's customer-facing services."
    - name: robots
      content: "index,follow"
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: preconnect
      href: https://fonts.gstatic.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap
  theme: light
  # Brand stylesheet — Hubpay palette (deep plum #241C3F, lavender #EDEAFD, blush #FCF5FF, green #239F57,
  # red #F83838, blue #1A46B7) applied through Upptime's theme variables plus structural restyling of the
  # status-page Svelte DOM (nav .logo, main.container header, section.live-status article, .tag, footer …).
  css: |
    :root, html, body {
      --plum: #241C3F; --plum-72: rgba(36,28,63,.72); --plum-56: rgba(36,28,63,.56); --plum-40: rgba(36,28,63,.40);
      --lavender: #EDEAFD; --blush: #FCF5FF; --green: #239F57; --red: #F83838; --blue: #1A46B7; --amber: #E9A23B;
      --body-background-color: #FBF9FF; --body-text-color: #241C3F;
      --card-background-color: #FFFFFF; --card-border-color: #E8E4F7;
      --nav-background-color: transparent; --nav-border-bottom-color: transparent; --nav-current-border-bottom-color: transparent;
      --up-border-left-color: #239F57; --degraded-border-left-color: #E9A23B; --down-border-left-color: #F83838; --down-background-color: #FFF1F1;
      --up-color-color: #241C3F; --degraded-color-color: #241C3F; --down-color-color: #241C3F;
      --tag-color: #FFFFFF; --tag-up-background-color: #239F57; --tag-degraded-background-color: #E9A23B; --tag-down-background-color: #F83838;
      --change-background-color: #EDEAFD;
      --submit-button-background-color: #241C3F; --submit-button-border-color: #241C3F; --submit-button-color: #FFFFFF;
      --error-button-background-color: #241C3F; --error-button-border-color: #241C3F; --error-button-color: #FFFFFF;
      --graph-opacity: 1; --graph-filter: none;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif !important;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      background: radial-gradient(1200px 520px at 50% -160px, #F3EFFF 0%, rgba(243,239,255,0) 70%), #FBF9FF !important;
      color: var(--plum) !important; padding-bottom: 3rem !important; line-height: 1.55;
    }
    a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .container { max-width: 860px !important; padding: 0 1.5rem !important; }
    h1, h2, h3, h4 { letter-spacing: -0.01em; }

    /* Nav */
    nav { border-bottom: none !important; margin-bottom: 1.5rem !important; padding: 0.75rem 1rem !important; box-shadow: none !important; }
    nav .container { max-width: 860px; }
    nav .logo { padding: 0.75rem 0 !important; margin-right: 1rem !important; }
    nav .logo img { height: 28px !important; width: auto !important; margin-right: 0 !important; border-radius: 0 !important; }
    nav ul { gap: 0.25rem; }
    nav ul a { color: var(--plum-72) !important; font-weight: 500; font-size: 0.92rem; padding: 0.55rem 0.9rem !important; border-radius: 999px; border-bottom: none !important; transition: background .15s ease, color .15s ease; }
    nav ul a:hover { color: var(--plum) !important; background: rgba(36,28,63,.06); }
    nav ul a[aria-current] { color: var(--plum) !important; background: var(--lavender); border-bottom: none !important; }

    /* Header */
    main.container header { margin: 1.5rem 0 1.75rem !important; }
    main.container header h1 { font-size: clamp(2rem, 4.5vw, 2.9rem) !important; font-weight: 700 !important; letter-spacing: -0.03em; line-height: 1.1 !important; margin-bottom: 0.6rem !important; }
    main.container header p.lead { color: var(--plum-72) !important; font-size: 1.02rem !important; max-width: 64ch; margin: 0; }
    main.container header p.lead a { color: var(--blue); }

    /* Overall status banner (rendered when there are no open incidents) */
    main.container > article.up {
      background: linear-gradient(135deg, #EAF8EF 0%, #F4FBF6 100%) !important; border: 1px solid #C8EBD5 !important; border-left: 1px solid #C8EBD5 !important;
      border-radius: 18px !important; padding: 1.15rem 1.4rem !important; font-weight: 600; font-size: 1.05rem; color: #14532D !important;
      box-shadow: 0 1px 0 rgba(20,83,45,.06), 0 12px 32px -18px rgba(35,159,87,.45); margin-bottom: 1.75rem;
    }

    /* Section headings */
    section h2, .f h2, main.container h2 { font-size: 0.82rem !important; font-weight: 600 !important; letter-spacing: 0.08em; text-transform: uppercase; color: var(--plum-56) !important; margin: 0 !important; }
    section + h2, section h2 { margin-top: 2rem !important; }
    main.container > div.f { margin: 2rem 0 0.85rem; }
    main.container > section + section { margin-top: 2.25rem; }
    main.container > section + section > h2 { margin-bottom: 0.75rem !important; }
    h3 { font-size: 0.8rem !important; font-weight: 600 !important; letter-spacing: 0.06em; text-transform: uppercase; color: var(--plum-40) !important; opacity: 1 !important; margin: 1.5rem 0 0.5rem !important; }

    /* Period selector → segmented pills */
    form.f.r { background: #FFFFFF; border: 1px solid var(--card-border-color); border-radius: 999px; padding: 0.2rem; gap: 0; box-shadow: 0 1px 2px rgba(36,28,63,.04); }
    form.f.r label { margin: 0 !important; padding: 0.3rem 0.75rem; border-radius: 999px; font-size: 0.82rem; font-weight: 500 !important; color: var(--plum-56); cursor: pointer; transition: background .15s ease, color .15s ease; }
    form.f.r label:hover { color: var(--plum); }
    form.f.r input:checked + label { background: var(--plum); color: #FFFFFF; font-weight: 600 !important; }

    /* Service cards */
    article {
      border-radius: 16px !important; border: 1px solid var(--card-border-color) !important; padding: 1.05rem 1.3rem !important;
      box-shadow: 0 1px 2px rgba(36,28,63,.04), 0 10px 30px -22px rgba(36,28,63,.35) !important; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    article + article { margin-top: 0.6rem !important; }
    article.link:hover { transform: translateY(-1px); border-color: #D9D3F2 !important; box-shadow: 0 2px 4px rgba(36,28,63,.05), 0 16px 36px -20px rgba(36,28,63,.45) !important; }
    section.live-status article.up, section.live-status article.degraded, section.live-status article.down { border-left: 1px solid var(--card-border-color) !important; }
    section.live-status article.down { background: #FFF6F6 !important; border-color: #FBD5D5 !important; }
    section.live-status article.degraded { background: #FFFAF0 !important; border-color: #F6E2B8 !important; }
    /* Response-time sparkline: Upptime renders it teal (#1abc9c) as a PNG background; re-draw it via a pseudo-element so it can be hue-shifted onto the plum palette */
    section.live-status article.graph { background-image: none !important; overflow: hidden; }
    section.live-status article.graph::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 42%; z-index: 0; pointer-events: none;
      background-image: var(--background); background-repeat: no-repeat; background-position: right center; background-size: auto 100%;
      filter: hue-rotate(85deg) saturate(.55) brightness(1.02); opacity: .9;
      -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, #000 35%); mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, #000 35%); }
    section.live-status article.graph > * { position: relative; z-index: 1; }
    section.live-status article.graph > h4 a::after { z-index: 2; }
    section.live-status article h4 { font-size: 1rem !important; font-weight: 600 !important; margin: 0 0 0.45rem !important; display: flex; align-items: center; gap: 0.5rem; padding-left: 1.1rem; position: relative; }
    section.live-status article h4::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(35,159,87,.15); }
    section.live-status article.degraded h4::before { background: var(--amber); box-shadow: 0 0 0 4px rgba(233,162,59,.18); }
    section.live-status article.down h4::before { background: var(--red); box-shadow: 0 0 0 4px rgba(248,56,56,.16); animation: hp-pulse 1.6s ease-in-out infinite; }
    @keyframes hp-pulse { 0%,100% { box-shadow: 0 0 0 4px rgba(248,56,56,.16); } 50% { box-shadow: 0 0 0 7px rgba(248,56,56,.06); } }
    section.live-status article h4 img.icon { display: none; }
    section.live-status article h4 a { color: var(--plum) !important; text-decoration: none; }
    section.live-status article > div { display: inline-flex; align-items: center; margin-right: 0.5rem; font-size: 0.86rem; color: var(--plum-56); padding-left: 1.1rem; }
    section.live-status article span.data { font-weight: 600 !important; color: var(--plum) !important; background: var(--lavender) !important; border-radius: 999px !important; padding: 0.1rem 0.55rem !important; margin-left: 0.35rem; font-variant-numeric: tabular-nums; }
    .changed + section .data { background: #DCD6FA !important; }

    /* Incident cards */
    article.down.link, article.degraded.link { border-left: 1px solid var(--card-border-color) !important; color: var(--plum) !important; }
    article.down-active { background: #FFF6F6 !important; border-color: #FBD5D5 !important; }
    article.down.link h4, article.down-active h4 { font-size: 1rem !important; font-weight: 600 !important; margin: 0 0 0.3rem !important; }
    article.down.link > .f > div:first-child > div, article.down-active > .f > div:first-child > div { font-size: 0.86rem; color: var(--plum-56); }
    article .f.r a, article .f .r a { color: var(--blue) !important; font-weight: 500; font-size: 0.9rem; text-decoration: none; }
    article .f.r a:hover { text-decoration: underline; }

    /* Tags (Up / Down / Fixed / Ongoing) */
    .tag { border-radius: 999px !important; padding: 0.25rem 0.65rem !important; font-size: 0.68rem !important; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

    /* History & incident pages */
    main.container section h1 { font-size: 1.75rem !important; font-weight: 700 !important; letter-spacing: -0.02em; }
    main.container section h1 a { color: var(--plum) !important; }
    main.container > h2 { font-size: 1.5rem !important; font-weight: 700 !important; letter-spacing: -0.02em; text-transform: none; color: var(--plum) !important; margin: 0.5rem 0 1.25rem !important; }
    dl { display: grid; grid-template-columns: auto auto; gap: 0.35rem 2rem; align-items: baseline; }
    dl dt { font-size: 0.78rem; font-weight: 600 !important; letter-spacing: 0.06em; text-transform: uppercase; color: var(--plum-56); }
    dl dd { margin: 0 !important; font-weight: 600; font-variant-numeric: tabular-nums; }
    main.container > footer a { color: var(--blue); font-weight: 500; text-decoration: none; }

    /* Buttons & loading */
    .submit-button, a.error-button { border-radius: 999px !important; padding: 0.6rem 1.2rem; font-weight: 600; text-decoration: none; }
    .loading svg { stroke: #B7AEE0 !important; }

    /* Hide the raw GitHub links the status-page template emits (incident pages, comment bylines) — customers stay on the status page */
    main.container a[href*="github.com"] { display: none !important; }

    /* Footer */
    body > #sapper > footer, footer { color: var(--plum-40) !important; font-size: 0.82rem; opacity: 1 !important; margin-top: 3.5rem !important; padding: 1.75rem 1.5rem 0; border-top: 1px solid var(--card-border-color); max-width: 860px; margin-left: auto !important; margin-right: auto !important; box-sizing: border-box; }
    footer a { color: var(--plum-72) !important; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      nav .container { flex-wrap: wrap; justify-content: center !important; }
      nav .logo { float: none !important; margin-right: 0 !important; }
      nav ul { width: 100%; justify-content: center; }
      main.container header h1 { font-size: 1.85rem !important; }
      main.container > div.f { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
      article { padding: 0.9rem 1rem !important; }
      section.live-status article.graph::after { display: none; }
      dl { grid-template-columns: 1fr; }
    }

# Notifications: create a Slack incoming webhook for #tech-service-alerts and store it as the repository
# secret NOTIFICATION_SLACK_WEBHOOK_URL, then uncomment:
# notifications:
#   - type: slack
#     channel: "#tech-service-alerts"

# Optional: add GitHub usernames to be assigned to incident issues, e.g.
# assignees:
#   - <andrew-github-username>

# Keep defaults: uptime check every 5 min, response-time graphs daily, summary README updated each run.
